<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloomreach Widget - API POST</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bloom: {
              yellow: '#FFD700',
              'yellow-hover': '#f5c800',
              'yellow-light': '#FFF8DC',
              'yellow-glow': 'rgba(255, 215, 0, 0.3)',
            },
            bloomreach: {
              50: '#fffef5',
              100: '#fffbdb',
              200: '#fff4a8',
              300: '#ffec6e',
              400: '#ffe234',
              500: '#FFD700',
              600: '#e6c200',
              700: '#bf9f00',
              800: '#997d00',
              900: '#7a6400',
            }
          },
          fontFamily: {
            bloomreach: ['"Bloomreach Sans"', '"DM Sans"', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'fade-in': 'fadeIn 0.5s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(255, 215, 0, 0.15)' },
              '100%': { boxShadow: '0 0 20px rgba(255, 215, 0, 0.25)' },
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Bloomreach Sans', 'DM Sans', 'Inter', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-dark {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .gradient-border {
      position: relative;
      border-radius: 16px;
    }
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 17px;
      padding: 1px;
      background: linear-gradient(135deg, #FFD700, #e6c200, #bf9f00);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    input:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
    }
    .btn-save {
      background: #FFD700;
      transition: all 0.3s ease;
    }
    .btn-save:hover {
      background: #f5c800;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.45);
    }
    .btn-save:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
    }
    .dot-pattern {
      background-image: radial-gradient(circle, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 0, 0.5);
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-yellow-50/40 via-white to-amber-50/20 dot-pattern font-bloomreach">

  <!-- Background decorative elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-yellow-200/15 rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-yellow-100/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 1.5s;"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gradient-to-r from-yellow-100/10 to-amber-50/10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative max-w-2xl mx-auto px-4 py-8 space-y-6">

    <!-- Header Card -->
    <div class="animate-fade-in">
      <div class="gradient-border">
        <div class="glass rounded-2xl p-6 border border-white/60">
          <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-4">
              <!-- Bloomreach Logo Icon -->
              <div class="w-12 h-12 rounded-xl bg-[#FFD700] flex items-center justify-center shadow-lg shadow-yellow-500/25">
                <svg class="w-7 h-7 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
              </div>
              <div>
                <h1 class="text-xl font-extrabold text-gray-900 tracking-tight">
                  Bloomreach Widget
                </h1>
                <p class="text-sm text-slate-500 font-medium">API POST Configuration</p>
              </div>
            </div>
            <!-- Status Badge -->
            <div id="statusBadge" class="flex items-center gap-2 px-4 py-2 rounded-full bg-yellow-50 border border-yellow-300">
              <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-[#FFD700] animate-pulse"></span>
              <span id="status" class="text-sm font-semibold text-yellow-800">Booting...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Card -->
    <div class="animate-slide-up" style="animation-delay: 0.1s;">
      <div class="glass rounded-2xl p-6 border border-white/60 shadow-xl shadow-yellow-500/5">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-8 h-8 rounded-lg bg-yellow-100 flex items-center justify-center">
            <svg class="w-4 h-4 text-yellow-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </div>
          <h2 class="text-lg font-bold text-slate-800">Configurazione Payload</h2>
        </div>

        <div class="space-y-5">
          <!-- Title Field -->
          <div class="group">
            <label for="title" class="block text-sm font-semibold text-slate-700 mb-2">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4 text-[#FFD700]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                </svg>
                Titolo
              </span>
            </label>
            <input
              id="title"
              type="text"
              value="Titolo di test"
              class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-white/80 text-slate-800 placeholder-slate-400 transition-all duration-200 hover:border-yellow-300 focus:border-[#FFD700]"
              placeholder="Inserisci il titolo..."
            />
          </div>

          <!-- Body Field -->
          <div class="group">
            <label for="bodyInput" class="block text-sm font-semibold text-slate-700 mb-2">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4 text-[#FFD700]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/>
                </svg>
                Contenuto
              </span>
            </label>
            <textarea
              id="bodyInput"
              rows="4"
              class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-white/80 text-slate-800 placeholder-slate-400 transition-all duration-200 hover:border-yellow-300 focus:border-[#FFD700] resize-none"
              placeholder="Inserisci il contenuto del messaggio..."
            >{{ customer.phone }}</textarea>
            <div class="flex justify-between items-center mt-2">
              <span class="text-xs font-medium text-slate-400 bg-yellow-50 border border-yellow-200 px-2.5 py-1 rounded-md font-mono">
                Jinja: <span class="text-yellow-700 font-semibold">{{ customer.phone }}</span>
              </span>
              <span class="text-xs font-medium text-slate-400">
                <span id="charCount" class="text-yellow-700 font-semibold">0</span> caratteri
              </span>
            </div>
          </div>

          <!-- User ID Field -->
          <div class="group">
            <label for="userId" class="block text-sm font-semibold text-slate-700 mb-2">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4 text-[#FFD700]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                User ID
              </span>
            </label>
            <input
              id="userId"
              type="text"
              value="{{ customer_ids.registered }}"
              class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 bg-white/80 text-slate-800 placeholder-slate-400 transition-all duration-200 hover:border-yellow-300 focus:border-[#FFD700]"
              placeholder="ID utente..."
            />
            <div class="mt-2">
              <span class="text-xs font-medium text-slate-400 bg-yellow-50 border border-yellow-200 px-2.5 py-1 rounded-md font-mono">
                Jinja: <span class="text-yellow-700 font-semibold">{{ customer_ids.registered }}</span>
              </span>
            </div>
          </div>
        </div>

        <!-- Single CTA Button - Salva Configurazione -->
        <div class="mt-8">
          <button
            id="sendBtn"
            class="btn-save w-full py-4 px-8 bg-[#FFD700] text-gray-900 border-[3px] border-[#FFD700] rounded-full text-base font-bold tracking-tight text-center flex items-center justify-center gap-3"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Salva Configurazione
          </button>
        </div>
      </div>
    </div>

    <!-- Output Card -->
    <div class="animate-slide-up" style="animation-delay: 0.2s;">
      <div class="glass rounded-2xl p-6 border border-white/60 shadow-xl shadow-yellow-500/5">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center">
              <svg class="w-4 h-4 text-[#FFD700]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
              </svg>
            </div>
            <h2 class="text-lg font-bold text-slate-800">Output</h2>
          </div>
          <button
            id="copyBtn"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 bg-slate-100 hover:bg-yellow-100 hover:text-yellow-800 transition-all duration-200"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            Copy
          </button>
        </div>
        <div class="glass-dark rounded-xl p-5 border border-slate-700/50 animate-glow">
          <pre id="output" class="text-sm leading-relaxed text-slate-300 font-mono m-0 max-h-64 overflow-auto">Waiting for action...</pre>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center animate-fade-in" style="animation-delay: 0.4s;">
      <div class="flex items-center justify-center gap-2">
        <span class="w-2.5 h-2.5 bg-[#FFD700] rounded-full inline-block shadow-sm shadow-yellow-400/50"></span>
        <p class="text-xs text-slate-400 font-medium">
          Powered by
          <span class="text-gray-900 font-bold">Bloomreach</span>
          Widget Protocol v1
        </p>
      </div>
    </div>

  </div>

  <script>
    const output = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const statusDot = document.getElementById('statusDot');
    const statusBadge = document.getElementById('statusBadge');
    const charCountEl = document.getElementById('charCount');
    const bodyInput = document.getElementById('bodyInput');

    let appOrigin = null;
    let helloAcked = false;

    function log(message) {
      output.textContent = typeof message === 'string'
        ? message
        : JSON.stringify(message, null, 2);
      console.log(message);
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusBadge.className = 'flex items-center gap-2 px-4 py-2 rounded-full transition-all duration-300';
      statusDot.className = 'w-2.5 h-2.5 rounded-full transition-all duration-300';

      switch(cls) {
        case 'ok':
          statusBadge.classList.add('bg-emerald-50', 'border', 'border-emerald-200');
          statusDot.classList.add('bg-emerald-400');
          statusEl.className = 'text-sm font-semibold text-emerald-700';
          break;
        case 'warn':
          statusBadge.classList.add('bg-yellow-50', 'border', 'border-yellow-300');
          statusDot.classList.add('bg-[#FFD700]', 'animate-pulse');
          statusEl.className = 'text-sm font-semibold text-yellow-800';
          break;
        case 'err':
          statusBadge.classList.add('bg-red-50', 'border', 'border-red-200');
          statusDot.classList.add('bg-red-400', 'animate-pulse');
          statusEl.className = 'text-sm font-semibold text-red-700';
          break;
      }
    }

    function sendToParent(message) {
      const targetOrigin = appOrigin || '*';
      window.parent.postMessage(message, targetOrigin);
    }

    function sendHello() {
      sendToParent({
        min_supported_version: 1,
        max_supported_version: 1,
        message_type: 'widget_hello'
      });
    }

    function getWidgetData() {
      return {
        title: document.getElementById('title').value,
        body: document.getElementById('bodyInput').value,
        userId: document.getElementById('userId').value
      };
    }

    function updateCharCount() {
      charCountEl.textContent = bodyInput.value.length;
    }

    // ─── Gestione messaggi da Bloomreach ───
    window.addEventListener('message', function(event) {
      const msg = event.data || {};

      if (msg.message_type) {
        appOrigin = event.origin;
      }

      switch (msg.message_type) {
        case 'app_hello':
          helloAcked = true;
          sendToParent({ message_type: 'widget_initialized' });
          setStatus('Connesso', 'ok');
          log({
            status: '✓ Connesso a Bloomreach',
            origin: appOrigin,
            timestamp: new Date().toISOString()
          });
          break;

        case 'app_request_state':
          const widgetData = getWidgetData();

          sendToParent({
            message_type: 'widget_state',
            webhook: {
              url: 'https://jsonplaceholder.typicode.com/posts',
              url_type: 'static',
              method: 'POST',
              response_handling: 'text',
              auth: null,
              headers: [
                {
                  name: 'Content-Type',
                  value: 'application/json; charset=UTF-8',
                  type: 'static'
                }
              ],
              body: JSON.stringify(widgetData),
              body_type: 'static',
              event_properties: {},
              frequency_policy: null,
              consent_category: null,
              general_consent: true
            },
            widget_state: widgetData
          });

          log({
            status: '✓ State inviato a Bloomreach',
            webhook_url: 'https://jsonplaceholder.typicode.com/posts',
            method: 'POST',
            payload: widgetData
          });
          setStatus('State inviato', 'ok');
          break;

        case 'errors':
          log({
            status: '✗ Errori di validazione',
            errors: msg.errors
          });
          setStatus('Errore', 'err');
          break;
      }
    });

    // ─── Boot ───
    window.addEventListener('load', function() {
      updateCharCount();
      sendHello();
      setInterval(() => {
        if (!helloAcked) sendHello();
      }, 1500);
    });

    // ─── Event listeners ───
    bodyInput.addEventListener('input', updateCharCount);

    // ─── Salva Configurazione Button ───
    document.getElementById('sendBtn').addEventListener('click', function() {
      const data = getWidgetData();
      log({
        preview: '📦 Payload che verrà inviato via webhook',
        timestamp: new Date().toISOString(),
        endpoint: 'https://jsonplaceholder.typicode.com/posts',
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        data: data
      });
      setStatus('Preview generata', 'ok');

      // Button feedback animation
      const btn = document.getElementById('sendBtn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `
        <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Elaborazione...
      `;
      btn.disabled = true;
      btn.style.opacity = '0.8';

      setTimeout(() => {
        btn.innerHTML = `
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Salvato!
        `;
        btn.style.opacity = '1';
        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.disabled = false;
        }, 1500);
      }, 800);
    });

    // ─── Copy button ───
    document.getElementById('copyBtn').addEventListener('click', function() {
      navigator.clipboard.writeText(output.textContent).then(() => {
        const btn = document.getElementById('copyBtn');
        const orig = btn.innerHTML;
        btn.innerHTML = `
          <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <span class="text-emerald-600">Copied!</span>
        `;
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      });
    });
  </script>
</body>
</html>
